<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokémon desktop widget</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default; }
  body { font-family: Inter, system-ui, sans-serif; }
  .px { font-family: Silkscreen, ui-monospace, monospace; }
  img { image-rendering: pixelated; -webkit-user-drag: none; }
  .card { box-sizing: border-box; background: #0E1319; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); display: none; flex-direction: column; overflow: hidden; }
  body[data-size="large"]  #lg { display: flex; }
  body[data-size="medium"] #md { display: flex; }
  body[data-size="small"]  #sm { display: flex; }
  body[data-size="mini"]   #mi { display: flex; }
  .panel { background: #141B24; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); box-sizing: border-box; }
  .label { font-family: Silkscreen, ui-monospace, monospace; font-size: 8px; letter-spacing: 1.2px; color: #8B97A8; }
  .hi { color: #F2F6FB; font-weight: 800; }
  .daycell { appearance: none; -webkit-appearance: none; border: 0; margin: 0; font: inherit; cursor: pointer; text-align: left; box-sizing: border-box; padding: 3px 4px; border-radius: 8px; display: flex; flex-direction: column; align-items: stretch; gap: 1px; overflow: hidden; }
  .daycell:hover { filter: brightness(1.4); }
  #route { position: relative; flex: none; box-sizing: border-box; background: #121A16; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); overflow: hidden; }
  .ball { appearance: none; -webkit-appearance: none; border: 0; margin: 0; padding: 0; cursor: pointer; position: absolute; left: 4px; top: 50%; margin-top: -22px; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; z-index: 5; }
  .ball:hover { filter: brightness(1.25); }
  .ball:active { transform: scale(0.94); }
  .walker { position: absolute; left: 0; image-rendering: pixelated; background-repeat: no-repeat; will-change: transform; transition: opacity .7s ease; cursor: grab; transform-origin: 50% 40%; }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }
  #snorlax { cursor: pointer; }
  @keyframes stir { 0%, 100% { transform: none; } 20% { transform: translateX(-2px) rotate(-5deg); } 40% { transform: translateX(2px) rotate(4deg); } 60% { transform: translate(-1px, -2px); } 80% { transform: translateX(1px); } }
  #snorlax.stir { animation: stir .6s ease-in-out; }
  .emote { position: absolute; pointer-events: none; z-index: 7; animation: emote 1.5s ease-out forwards; }
  .emote svg { display: block; }
  @keyframes emote { 0% { transform: translateY(3px) scale(.3); opacity: 0; } 14% { transform: translateY(0) scale(1.2); opacity: 1; } 24% { transform: scale(1); } 75% { opacity: 1; } 100% { transform: translateY(-9px); opacity: 0; } }
  .nameTag { position: absolute; z-index: 7; pointer-events: none; font-family: Silkscreen, ui-monospace, monospace; font-size: 8px; letter-spacing: .5px; line-height: 10px; padding: 1px 4px; border-radius: 4px; background: rgba(10,14,19,.88); color: #E6ECF4; white-space: nowrap; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .dust { position: absolute; width: 2px; height: 2px; background: #9AA7B8; pointer-events: none; z-index: 3; transition: transform .45s ease-out, opacity .45s ease-out; }
  @keyframes snooze { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .snooze { animation: snooze 3.4s ease-in-out infinite; }
  .sparkle { position: absolute; width: 7px; height: 7px; pointer-events: none; z-index: 4; animation: twinkle .9s ease-out forwards; }
  .sparkle::before, .sparkle::after { content: ''; position: absolute; left: 3px; top: 0; width: 1px; height: 7px; background: currentColor; border-radius: 1px; }
  .sparkle::after { transform: rotate(90deg); }
  @keyframes twinkle { 0% { transform: scale(0) rotate(0); opacity: 1; } 55% { transform: scale(1) rotate(45deg); opacity: 1; } 100% { transform: scale(.3) rotate(90deg); opacity: 0; } }
  .shinyTag { position: absolute; top: 5px; font-family: Silkscreen, ui-monospace, monospace; font-size: 8px; letter-spacing: 1px; z-index: 4; pointer-events: none; transition: opacity .8s ease; white-space: nowrap; }
</style>
</head>
<body data-size="large">

<!-- ===================== LARGE 560×470 (the original design) ===================== -->
<div class="card" id="lg" style="width: 560px; height: 470px; padding: 14px; border-radius: 22px; gap: 10px">

  <div style="height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
    <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span class="px" data-accent="color" style="font-size: 8px; letter-spacing: 1.4px">TRAINER CARD</span>
      <span data-k="name" style="font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #F2F6FB; line-height: 1.1">TRAINER</span>
      <span data-k="dateLine" style="font-size: 11px; font-weight: 500; color: #9AA7B8">&nbsp;</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; flex: none">
      <img data-k="wxSprite" alt="" style="width: 54px; height: 54px; object-fit: contain">
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
        <span data-k="wxTemp" style="font-size: 30px; font-weight: 800; letter-spacing: -1px; color: #F2F6FB; line-height: 1">--°</span>
        <span data-k="wxName" style="font-size: 11px; font-weight: 600; color: #E6ECF4">Loading</span>
        <span data-k="wxHL" style="font-size: 10px; font-weight: 500; color: #9AA7B8">&nbsp;</span>
      </div>
    </div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 10px">
    <div class="panel" style="width: 332px; flex: none; padding: 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
        <span class="px" style="font-size: 9px; letter-spacing: 1.2px; color: #E6ECF4" id="monthLabel">&nbsp;</span>
        <span style="font-size: 9px; font-weight: 600; color: #9AA7B8; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis" id="detail">bar = commits that day</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px" id="weekdays"></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px" id="days"></div>
    </div>

    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <div class="panel" style="flex: 1 1 0; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between">
        <span class="label">COMMIT STREAK</span>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 6px">
          <span style="display: flex; align-items: baseline; gap: 4px">
            <span data-k="streak" data-accent="color" style="font-size: 34px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">0</span>
            <span data-k="streakUnit" style="font-size: 10px; font-weight: 600; color: #9AA7B8">days</span>
          </span>
          <img data-k="streakSprite" alt="" style="width: 52px; height: 52px; object-fit: contain; margin-bottom: -4px">
        </div>
        <div style="display: flex; align-items: flex-end; gap: 3px; height: 22px" id="week"></div>
        <span data-k="evoNote" style="font-size: 9px; font-weight: 500; color: #9AA7B8">&nbsp;</span>
      </div>

      <div class="panel" style="flex: 1 1 0; min-height: 0; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between">
        <span class="label">SYSTEM HP</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 4px">
              <span style="font-size: 11px; font-weight: 700; color: #F2F6FB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis" id="model">MAC</span>
              <span style="font-size: 9px; font-weight: 600; color: #9AA7B8; flex: none" id="level">Lv.1</span>
            </span>
            <span style="display: flex; align-items: center; gap: 4px">
              <span class="px" data-accent="color" style="font-size: 7px; flex: none">HP</span>
              <span style="flex: 1 1 auto; min-width: 0; display: block; height: 8px; border-radius: 5px; background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); overflow: hidden">
                <span style="display: block; height: 8px; border-radius: 5px; width: 0; transition: width .6s ease, background-color .6s ease" id="hpBar"></span>
              </span>
            </span>
            <span style="font-size: 9px; font-weight: 600; color: #9AA7B8" id="hpNote">&nbsp;</span>
          </div>
          <img id="vitalSprite" alt="" style="width: 38px; height: 38px; object-fit: contain; flex: none">
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 4px">
          <span style="font-size: 9px; font-weight: 600; color: #8B97A8">CPU <span style="color: #E6ECF4" id="cpu">--</span></span>
          <span style="font-size: 9px; font-weight: 600; color: #8B97A8">DISK <span style="color: #E6ECF4" id="disk">--</span></span>
          <span style="font-size: 9px; font-weight: 600; color: #8B97A8">BAT <span style="color: #E6ECF4" id="bat">--</span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="routeSlot"></div>
</div>

<!-- ===================== MEDIUM 748×190: today, 7-day forecast, streak + system stats, open route ===================== -->
<div class="card" id="md" style="width: 748px; height: 190px; padding: 18px 18px 14px; border-radius: 22px; gap: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1)">
  <div style="height: 104px; flex: none; display: flex; gap: 10px">

    <!-- Today -->
    <div class="panel" style="width: 158px; flex: none; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between">
      <span class="px" data-k="dateShort" data-accent="color" style="font-size: 9px; letter-spacing: 1.4px">&nbsp;</span>
      <div style="display: flex; align-items: center; gap: 8px">
        <img data-k="wxSprite" alt="" style="width: 36px; height: 36px; object-fit: contain; flex: none">
        <span data-k="wxTemp" style="font-size: 28px; font-weight: 800; letter-spacing: -1px; color: #F2F6FB; line-height: 1">--°</span>
      </div>
      <span data-k="wxLine" style="font-size: 10px; font-weight: 600; color: #9AA7B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">&nbsp;</span>
    </div>

    <!-- 7-day forecast, today first -->
    <div class="panel" style="width: 352px; flex: none; border-radius: 12px; padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 5px">
      <span class="label" style="font-size: 8px; letter-spacing: 1.8px; padding-left: 2px">7-DAY FORECAST</span>
      <div id="next7" style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; align-items: stretch"></div>
    </div>

    <!-- Streak + system stats -->
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <div class="panel" style="height: 38px; flex: none; border-radius: 10px; padding: 0 6px 0 12px; display: flex; align-items: center; gap: 6px">
        <span class="label" style="font-size: 7px; letter-spacing: 1.5px">STREAK</span>
        <span data-k="streak" data-accent="color" style="font-size: 20px; font-weight: 800; letter-spacing: -1px; line-height: 1">0</span>
        <span data-k="streakUnit" style="font-size: 10px; font-weight: 600; color: #9AA7B8">days</span>
        <img data-k="streakSprite" alt="" style="width: 32px; height: 32px; object-fit: contain; margin-left: auto">
      </div>
      <div class="panel" style="flex: 1 1 auto; min-height: 0; border-radius: 10px; padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 12px; row-gap: 7px; align-content: center">
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px">
            <span class="px" style="font-size: 7px; letter-spacing: 1px; color: #8B97A8">RAM</span>
            <span data-k="ramPct" style="font-size: 11px; font-weight: 700; color: #E6ECF4">--</span>
          </span>
          <span style="display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden">
            <span data-k="ramBar" style="display: block; height: 4px; width: 0; border-radius: 2px; transition: width .6s ease, background-color .6s ease"></span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px">
            <span class="px" style="font-size: 7px; letter-spacing: 1px; color: #8B97A8">CPU</span>
            <span data-k="cpuPct" style="font-size: 11px; font-weight: 700; color: #E6ECF4">--</span>
          </span>
          <span style="display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden">
            <span data-k="cpuBar" style="display: block; height: 4px; width: 0; border-radius: 2px; transition: width .6s ease, background-color .6s ease"></span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px">
            <span class="px" style="font-size: 7px; letter-spacing: 1px; color: #8B97A8">DISK</span>
            <span data-k="diskPct" style="font-size: 11px; font-weight: 700; color: #E6ECF4">--</span>
          </span>
          <span style="display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden">
            <span data-k="diskBar" style="display: block; height: 4px; width: 0; border-radius: 2px; transition: width .6s ease, background-color .6s ease"></span>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px">
            <span class="px" style="font-size: 7px; letter-spacing: 1px; color: #8B97A8">BAT</span>
            <span data-k="batPct" style="font-size: 11px; font-weight: 700; color: #E6ECF4">--</span>
          </span>
          <span style="display: block; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden">
            <span data-k="batBar" style="display: block; height: 4px; width: 0; border-radius: 2px; transition: width .6s ease, background-color .6s ease"></span>
          </span>
        </div>
      </div>
    </div>
  </div>
  <div class="routeSlot"></div>
</div>

<!-- ===================== SMALL 170×170: weather, streak, one walker ===================== -->
<div class="card" id="sm" style="width: 170px; height: 170px; padding: 12px; border-radius: 20px; gap: 6px">
  <div style="height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 4px">
    <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
      <span data-k="wxTemp" style="font-size: 26px; font-weight: 800; letter-spacing: -1px; color: #F2F6FB; line-height: 1">--°</span>
      <span data-k="wxName" style="font-size: 10px; font-weight: 600; color: #E6ECF4; white-space: nowrap">Loading</span>
      <span data-k="wxHL" style="font-size: 9px; font-weight: 500; color: #9AA7B8; white-space: nowrap">&nbsp;</span>
    </div>
    <img data-k="wxSprite" alt="" style="width: 44px; height: 44px; object-fit: contain; flex: none">
  </div>
  <div class="panel" style="height: 44px; flex: none; border-radius: 10px; padding: 5px 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px">
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span class="label" style="font-size: 7px">STREAK</span>
      <span style="display: flex; align-items: baseline; gap: 3px">
        <span data-k="streak" data-accent="color" style="font-size: 20px; font-weight: 800; letter-spacing: -1px; line-height: 1">0</span>
        <span data-k="streakUnit" style="font-size: 9px; font-weight: 600; color: #9AA7B8">days</span>
      </span>
    </div>
    <img data-k="streakSprite" alt="" style="width: 36px; height: 36px; object-fit: contain; flex: none">
  </div>
  <div class="routeSlot"></div>
</div>

<!-- ===================== MINI 320×64: just the route ===================== -->
<div class="card" id="mi" style="width: 320px; height: 64px; padding: 0; border-radius: 16px; background: transparent; box-shadow: none">
  <div class="routeSlot"></div>
</div>

<!-- The route lives in whichever layout is showing. -->
<div id="route">
  <span id="groundLine" style="position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.07)"></span>
  <svg class="grass" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="position: absolute; left: 150px; opacity: 0.5"><path d="M2 10 L4 2 M6 10 L6 1 M10 10 L8 3" stroke="#4E7F5A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
  <svg class="grass" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="position: absolute; left: 318px; opacity: 0.5"><path d="M2 10 L4 2 M6 10 L6 1 M10 10 L8 3" stroke="#4E7F5A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
  <svg class="grass" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="position: absolute; left: 424px; opacity: 0.5"><path d="M2 10 L4 2 M6 10 L6 1 M10 10 L8 3" stroke="#4E7F5A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
  <svg class="grass" width="12" height="10" viewBox="0 0 12 10" aria-hidden="true" style="position: absolute; left: 96px; opacity: 0.5"><path d="M2 10 L4 2 M6 10 L6 1 M10 10 L8 3" stroke="#4E7F5A" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>

  <button type="button" class="ball" id="ball" aria-label="Shuffle the Pokémon roaming this route">
    <svg width="22" height="22" viewBox="0 0 22 22" role="img" aria-label="Poké Ball">
      <circle cx="11" cy="11" r="9.25" fill="none" stroke="#E6ECF4" stroke-width="1.5"/>
      <path d="M1.75 11 H8" stroke="#E6ECF4" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M14 11 H20.25" stroke="#E6ECF4" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="11" cy="11" r="3" fill="none" stroke-width="1.5" data-accent="stroke"/>
    </svg>
  </button>

  <img id="snorlax" alt="" class="snooze" style="position: absolute; right: 8px; width: 46px; height: 46px; object-fit: contain">
  <span id="zzz" class="px" style="position: absolute; right: 56px; font-size: 8px; color: #8B97A8">Zzz</span>
</div>

<script>
(function () {
  var SPR = 'pw://sprites/';
  var gif = function (dex) { return SPR + 'bw/' + dex + '.gif'; };
  var $ = function (id) { return document.getElementById(id); };
  var all = function (k) { return document.querySelectorAll('[data-k="' + k + '"]'); };
  function setText(k, t) { all(k).forEach(function (e) { e.textContent = t; }); }
  function setHTML(k, h) { all(k).forEach(function (e) { e.innerHTML = h; }); }
  function setSrc(k, s) { all(k).forEach(function (e) { if (e.getAttribute('src') !== s) { e.src = s; } }); }

  var WX = {
    s: { name: 'Sunny', dex: 192 },
    p: { name: 'Part cloud', dex: 333 },
    c: { name: 'Overcast', dex: 351 },
    h: { name: 'Haze', dex: 92 },
    r: { name: 'Rain', dex: 7 },
    t: { name: 'Storm', dex: 25 },
    n: { name: 'Snow', dex: 361 },
    w: { name: 'Windy', dex: 16 }
  };
  // WMO weather codes (Open-Meteo) to the design's eight conditions.
  function cond(code, wind) {
    if (code == null) { return null; }
    if (code >= 95) { return 't'; }
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) { return 'n'; }
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) { return 'r'; }
    if (code === 45 || code === 48) { return 'h'; }
    if (wind != null && wind >= 40) { return 'w'; }
    if (code === 0) { return 's'; }
    if (code <= 2) { return 'p'; }
    return 'c';
  }

  var GREENS = ['rgba(255,255,255,0.09)', '#0E4429', '#006D32', '#26A641', '#39D353'];
  function level(n) {
    if (!n) { return 0; }
    if (n <= 2) { return 1; }
    if (n <= 5) { return 2; }
    if (n <= 8) { return 3; }
    return 4;
  }

  var state = { data: null, picked: 0, accent: '#FFCB05' };

  function post(msg) {
    try { window.webkit.messageHandlers.native.postMessage(msg); } catch (e) {}
  }

  // Drag the widget from anywhere that isn't a button, a Pokémon or Snorlax.
  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0) { return; }
    if (e.target.closest('button, #snorlax')) { return; }
    var w = e.target.closest('.walker');
    if (w && w.walker && !w.walker.gone) { e.preventDefault(); startPress(w.walker, e); return; }
    post({ type: 'drag' });
  });
  // Press on a Pokémon: a click pets it, a drag picks it up.
  document.addEventListener('mousemove', function (e) {
    if (!press) { return; }
    if (!press.held) {
      if (Math.abs(e.clientX - press.x0) + Math.abs(e.clientY - press.y0) < 4) { return; }
      press.held = true;
      press.w.pickUp();
    }
    press.w.carry(e);
  });
  document.addEventListener('mouseup', function () {
    if (!press) { return; }
    var p = press;
    endPress();
    if (p.held) { p.w.drop(); } else { p.w.pet(); }
  });
  window.addEventListener('blur', function () { if (press) { var p = press; endPress(); if (p.held) { p.w.drop(); } } });

  (function weekdays() {
    var html = '';
    'SMTWTFS'.split('').forEach(function (l, i) {
      var c = (i === 0 || i === 6) ? '#6F7C8D' : '#8B97A8';
      html += '<span class="px" style="font-size: 8px; color: ' + c + '; text-align: center">' + l + '</span>';
    });
    $('weekdays').innerHTML = html;
  })();

  function applyAccent() {
    var a = state.accent;
    document.querySelectorAll('[data-accent]').forEach(function (e) {
      if (e.getAttribute('data-accent') === 'stroke') { e.setAttribute('stroke', a); } else { e.style.color = a; }
    });
  }

  function dayWeather(d, n) {
    return weatherFor(d, d.month.ym + '-' + (n < 10 ? '0' : '') + n);
  }
  function weatherFor(d, key) {
    var w = d.weather && d.weather.days ? d.weather.days[key] : null;
    if (!w) { return null; }
    var k = cond(w[0], w[3]);
    return { k: k, name: WX[k].name, dex: WX[k].dex, hi: Math.round(w[1]), lo: Math.round(w[2]) };
  }

  function renderDetail() {
    var d = state.data, sel = state.picked;
    if (!d || !sel) { $('detail').textContent = 'bar = commits that day'; return; }
    var w = dayWeather(d, sel);
    var t = d.month.short + ' ' + sel;
    t += w ? ' · ' + w.name + ' ' + w.hi + '°/' + w.lo + '°' : ' · no forecast yet';
    if (sel <= d.month.today && d.commits) { t += ' · ' + (d.commits.byDay[sel - 1] || 0) + ' commits'; }
    $('detail').textContent = t;
  }

  function renderCalendar() {
    var d = state.data, m = d.month, a = state.accent;
    var rows = Math.ceil((m.firstWeekday + m.days) / 7);
    var h = rows > 5 ? 36 : 44, sp = rows > 5 ? 18 : 22;
    var html = '';
    for (var b = 0; b < m.firstWeekday; b++) { html += '<span></span>'; }
    for (var n = 1; n <= m.days; n++) {
      var w = dayWeather(d, n);
      var past = n <= m.today, isToday = n === m.today;
      var c = past && d.commits ? (d.commits.byDay[n - 1] || 0) : null;
      var bg = state.picked === n ? 'rgba(255,255,255,0.12)' : (isToday ? 'rgba(255,255,255,0.09)' : 'rgba(255,255,255,0.045)');
      var ring = isToday ? 'inset 0 0 0 1.5px ' + a : 'inset 0 0 0 1px rgba(255,255,255,0.04)';
      var stripe = past && d.commits ? GREENS[level(c)] : 'transparent';
      var aria = m.long + ' ' + n + (w ? ', ' + w.name + ', high ' + w.hi + ' degrees, low ' + w.lo + ' degrees' : '') + (c != null ? ', ' + c + ' commits' : '');
      html += '<button type="button" class="daycell" data-n="' + n + '" aria-label="' + aria + '" style="height: ' + h + 'px; background: ' + bg + '; box-shadow: ' + ring + '">'
        + '<span style="display: flex; align-items: baseline; justify-content: space-between; gap: 1px">'
        + '<span style="font-size: 10px; font-weight: 700; color: ' + (isToday ? a : '#E6ECF4') + '">' + n + '</span>'
        + '<span style="font-size: 9px; font-weight: 600; color: #B9C5D4">' + (w ? w.hi + '°' : '') + '</span></span>'
        + (w ? '<img src="' + gif(w.dex) + '" alt="" style="width: ' + sp + 'px; height: ' + sp + 'px; object-fit: contain; align-self: center">'
             : '<span style="height: ' + sp + 'px"></span>')
        + '<span style="display: block; height: 3px; border-radius: 2px; background: ' + stripe + '"></span>'
        + '</button>';
    }
    $('days').innerHTML = html;
  }

  $('days').addEventListener('click', function (e) {
    var b = e.target.closest('.daycell');
    if (!b) { return; }
    var n = +b.getAttribute('data-n');
    state.picked = state.picked === n ? 0 : n;
    renderCalendar();
    renderDetail();
  });

  function renderHeader() {
    var d = state.data;
    setText('name', d.name);
    setText('dateLine', d.dateLine);
    setText('dateShort', d.dateShort || '');
    var cur = d.weather && d.weather.current;
    var today = dayWeather(d, d.month.today);
    var name;
    if (cur) {
      var k = cond(cur.code, cur.wind);
      name = WX[k].name;
      setText('wxTemp', Math.round(cur.temp) + '°');
      setText('wxName', name);
      setSrc('wxSprite', gif(WX[k].dex));
    } else {
      name = d.weatherError ? 'Offline' : 'Loading';
      setText('wxTemp', '--°');
      setText('wxName', name);
    }
    setHTML('wxHL', today ? 'H ' + today.hi + '° &nbsp;L ' + today.lo + '°' : '&nbsp;');
    setText('wxLine', name + (today ? ' · H ' + today.hi + '° L ' + today.lo + '°' : ''));
    renderNext7();
  }

  function renderNext7() {
    var d = state.data, up = d.upcoming || [];
    var a = state.accent;
    $('next7').innerHTML = up.map(function (u) {
      var w = weatherFor(d, u.key);
      // Today gets the same accent ring as today's cell on the big calendar.
      var box = u.today
        ? 'background: rgba(255,255,255,0.09); box-shadow: inset 0 0 0 1.5px ' + a + ';'
        : 'background: transparent;';
      return '<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 8px; ' + box + '">'
        + '<span class="px" style="font-size: 8px; color: ' + (u.today ? a : '#8B97A8') + '">' + u.letter + '</span>'
        + (w ? '<img src="' + gif(w.dex) + '" alt="' + w.name + '" style="width: 26px; height: 26px; object-fit: contain">'
             : '<span style="width: 26px; height: 26px"></span>')
        + '<span style="font-size: 11px; font-weight: 700; color: ' + (u.today ? '#F2F6FB' : '#E6ECF4') + '">' + (w ? w.hi + '°' : '–') + '</span>'
        + '</div>';
    }).join('');
  }

  function renderStreak() {
    var d = state.data, c = d.commits;
    if (!c) {
      setText('streak', '–');
      setText('evoNote', 'GitHub contributions unavailable');
      setSrc('streakSprite', gif(4));
      $('week').innerHTML = '';
      return;
    }
    var streak = c.streak;
    setText('streak', streak);
    setText('streakUnit', streak === 1 ? 'day' : 'days');
    setText('streakUnitLong', 'day streak');
    var sprite = 4, note;
    if (streak >= 30) { sprite = 6; note = 'Charizard · fully evolved'; }
    else if (streak >= 7) { sprite = 5; note = 'Charmeleon · ' + (30 - streak) + ' days to Charizard'; }
    else { note = 'Charmander · ' + (7 - streak) + ' day' + (7 - streak === 1 ? '' : 's') + ' to evolve'; }
    setSrc('streakSprite', gif(sprite));
    setText('evoNote', note);
    var maxC = 1;
    c.last7.forEach(function (n) { maxC = Math.max(maxC, n); });
    $('week').innerHTML = c.last7.map(function (n) {
      return '<span style="flex: 1 1 0; border-radius: 2px; background: ' + GREENS[level(n)] + '; height: ' + Math.max(3, Math.round((n / maxC) * 22)) + 'px"></span>';
    }).join('');
  }

  function renderSystem() {
    var s = state.data && state.data.system;
    if (!s) { return; }
    var hp = Math.round(s.memFree);
    $('model').textContent = s.model;
    $('level').textContent = 'Lv.' + s.level;
    var hpColor = hp > 60 ? '#39D353' : (hp > 30 ? '#FFCB05' : '#E3350D');
    [$('hpBar')].concat([].slice.call(all('hpBar'))).forEach(function (b) {
      b.style.width = hp + '%';
      b.style.backgroundColor = hpColor;
    });
    $('hpNote').textContent = hp + '% memory free';
    setText('hpPct', hp + '%');
    var v = hp > 60 ? 39 : (hp > 30 ? 54 : 92);
    var src = gif(v);
    if ($('vitalSprite').getAttribute('src') !== src) { $('vitalSprite').src = src; }
    setSrc('vitalSprite', src);
    $('cpu').textContent = Math.round(s.cpu) + '%';
    $('disk').textContent = Math.round(s.disk) + '%';
    $('bat').textContent = s.battery == null ? 'AC' : s.battery + '%';

    // Medium's stats card: RAM, CPU and disk as % used (bars warm up as they fill), battery as % charged.
    var used = function (p) { return p < 60 ? '#39D353' : (p < 85 ? '#FFCB05' : '#E3350D'); };
    var stat = function (key, pct, color, text) {
      setText(key + 'Pct', text != null ? text : pct + '%');
      all(key + 'Bar').forEach(function (b) { b.style.width = pct + '%'; b.style.backgroundColor = color; });
    };
    var ram = 100 - hp, cpu = Math.round(s.cpu), disk = Math.round(s.disk);
    stat('ram', ram, used(ram));
    stat('cpu', cpu, used(cpu));
    stat('disk', disk, used(disk));
    if (s.battery == null) { stat('bat', 100, '#5A6573', 'AC'); }
    else { stat('bat', s.battery, s.battery > 40 ? '#39D353' : (s.battery > 15 ? '#FFCB05' : '#E3350D')); }
  }

  // ---------- Route: Pokémon walking with real walk-cycle sheets ----------
  var walk = {};          // dex -> {fw, fh, durs, padSide, padDown, h}
  var walkShiny = {};     // same, for the shiny sheets
  var walkers = [];
  var names = {};         // dex -> display name
  var shinyOdds = 64;     // 1 in N spawns is shiny
  var ROW_DOWN = 0, ROW_RIGHT = 2, ROW_LEFT = 6;

  // Route geometry for each size.
  var ROUTES = {
    large:  { w: 532, h: 56, pad: 6, radius: 14, ground: 10, minX: 54, right: 64, count: 3, ball: true,  snorlax: true,  maxH: 40 },
    // Medium's route is open ground (no panel), like the mockup.
    medium: { w: 712, h: 48, pad: 0, radius: 0, ground: 6, minX: 50, right: 52, count: 4, ball: true, snorlax: true, maxH: 40,
              open: true, ballSize: 36, snorlaxSize: 40, grass: [230, 480] },
    small:  { w: 146, h: 46, pad: 4, radius: 12, ground: 8,  minX: 4,  right: 4,  count: 1, ball: false, snorlax: false, maxH: 34 },
    mini:   { w: 320, h: 64, pad: 6, radius: 16, ground: 12, minX: 54, right: 62, count: 2, ball: true,  snorlax: true,  maxH: 44 }
  };
  var size = 'large';
  var G = ROUTES.large;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function maxXFor(fw) { return G.w - G.right - fw; }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function Walker(dex, x, shiny, quiet) {
    var m = shiny ? walkShiny[dex] : walk[dex];
    this.dex = dex; this.m = m; this.shiny = !!shiny;
    this.base = SPR + (shiny ? 'shiny/' : '');
    this.sparkleIn = rand(0.6, 2);
    this.x = x; this.y = 0; this.vy = 0; this.tilt = 0;
    this.dir = Math.random() < 0.5 ? -1 : 1;
    this.mode = 'idle'; this.timer = rand(0.3, 2.5);
    this.frame = 0; this.ft = 0;
    this.speed = rand(14, 24); this.walkSpeed = this.speed;
    this.anim = null; this.face = null; this.seq = 0; this.partner = null;
    this.cool = rand(4, 10); this.pets = []; this.hover = false; this.tag = null;
    var el = document.createElement('div');
    el.className = 'walker';
    el.style.opacity = '0';
    el.walker = this;
    this.el = el; this.sheetKey = '';
    $('route').insertBefore(el, $('snorlax'));
    this.preload();
    this.draw();
    var self = this;
    el.addEventListener('mouseenter', function () { self.hoverIn(); });
    el.addEventListener('mouseleave', function () { self.hoverOut(); });
    requestAnimationFrame(function () { el.style.opacity = '1'; });
    if (this.shiny && !quiet) { this.celebrate(); }
  }
  Walker.prototype.center = function () { return this.x + this.m.fw / 2; };
  Walker.prototype.preload = function () {
    var a = this.m.anims || {}, self = this;
    this.imgs = Object.keys(a).map(function (k) { var i = new Image(); i.src = self.base + 'anim/' + a[k].src + '/' + self.dex + '.png'; return i; });
  };
  // Runs fn after `sec` unless this walker has moved on to something else in the meantime.
  Walker.prototype.later = function (sec, fn) {
    var self = this, seq = this.seq;
    setTimeout(function () { if (self.seq === seq && !self.gone) { fn(); } }, sec * 1000);
  };
  Walker.prototype.sparkle = function () {
    var s = document.createElement('span');
    s.className = 'sparkle';
    s.style.color = Math.random() < 0.5 ? '#FFF6C2' : state.accent;
    s.style.left = Math.round(this.x + rand(-3, this.m.fw - 4)) + 'px';
    s.style.bottom = Math.round(G.ground + this.y + rand(0, this.m.h + 6)) + 'px';
    $('route').appendChild(s);
    setTimeout(function () { s.remove(); }, 950);
  };
  Walker.prototype.celebrate = function () {
    var self = this;
    for (var i = 0; i < 9; i++) { setTimeout(function () { if (self.el.isConnected) { self.sparkle(); } }, i * 110); }
    var tag = document.createElement('span');
    tag.className = 'shinyTag';
    tag.textContent = 'SHINY!';
    tag.style.color = state.accent;
    tag.style.left = Math.round(Math.max(G.minX - 2, Math.min(this.x + this.m.fw / 2 - 18, G.w - G.right - 36))) + 'px';
    $('route').appendChild(tag);
    setTimeout(function () { tag.style.opacity = '0'; }, 5000);
    setTimeout(function () { tag.remove(); }, 6000);
    post({ type: 'shiny', dex: this.dex });
  };

  // ---- Animations: the walker's own sheet for each one when downloaded, else its walk sheet with a stand-in motion.
  Walker.prototype.sheetFor = function (name) {
    var a = this.m.anims && this.m.anims[name];
    if (a) {
      return { url: this.base + 'anim/' + a.src + '/' + this.dex + '.png', fw: a.fw, fh: a.fh, durs: a.durs,
               hit: a.hit != null ? a.hit : Math.floor(a.durs.length / 2) };
    }
    var durs = name === 'Idle' ? [40] : this.m.durs;
    return { url: this.base + 'walk/' + this.dex + '.png', fw: this.m.fw, fh: this.m.fh, durs: durs,
             hit: Math.floor(durs.length / 2), fake: name };
  };
  // Play `name` facing `row`. opts: loops (Infinity holds it until something else plays), hit(), done().
  Walker.prototype.play = function (name, row, opts) {
    opts = opts || {};
    var s = this.sheetFor(name), total = 0;
    s.durs.forEach(function (d) { total += d; });
    this.anim = { s: s, row: row, frame: 0, ft: 0, t: 0, total: total, loops: opts.loops || 1, hit: opts.hit, done: opts.done };
  };
  Walker.prototype.stepAnim = function (dt) {
    var a = this.anim;
    a.ft += dt * 60; a.t += dt * 60;
    while (this.anim === a && a.ft >= a.s.durs[a.frame]) {
      a.ft -= a.s.durs[a.frame];
      a.frame++;
      if (a.hit && a.frame === a.s.hit) { a.hit(); }
      if (this.anim !== a) { break; }
      if (a.frame >= a.s.durs.length) {
        if (--a.loops > 0) { a.frame = 0; a.t = 0; }
        else { a.frame = a.s.durs.length - 1; this.anim = null; if (a.done) { a.done(); } }
      }
    }
  };
  Walker.prototype.hold = function () { this.play('Idle', this.face != null ? this.face : ROW_DOWN, { loops: Infinity }); };

  // ---- Behaviour states: idle / walk (roaming), look (hovered), act (scripted), held, fall.
  Walker.prototype.resume = function (pause) {
    this.seq++;
    this.anim = null; this.partner = null; this.face = null;
    this.mode = 'idle'; this.timer = pause != null ? pause : rand(0.6, 2);
    this.frame = 0; this.y = 0; this.vy = 0; this.tilt = 0; this.walkSpeed = this.speed;
    this.el.style.zIndex = '';
  };
  Walker.prototype.walkTo = function (x, speed) {
    var t = Math.round(place(this.m, x));
    if (Math.abs(t - this.x) < 4) { return; }
    this.target = t; this.dir = t > this.x ? 1 : -1;
    this.mode = 'walk'; this.frame = 0; this.ft = 0; this.anim = null; this.face = null;
    this.walkSpeed = speed || this.speed;
  };
  // Leave whatever scene this walker shares with another (the other one goes back to roaming).
  Walker.prototype.breakUp = function () {
    var p = this.partner;
    if (!p) { return; }
    this.partner = null; p.partner = null;
    if (p.mode === 'act') { p.resume(rand(0.3, 1)); }
  };
  Walker.prototype.busy = function () { return this.mode === 'act' || this.mode === 'held' || this.mode === 'fall'; };
  Walker.prototype.step = function (dt) {
    if (this.shiny) {
      this.sparkleIn -= dt;
      if (this.sparkleIn <= 0) { this.sparkle(); this.sparkleIn = rand(0.8, 2.4); }
    }
    this.cool -= dt;
    if (this.anim) { this.stepAnim(dt); }
    if (this.mode === 'held') {
      this.tilt *= Math.pow(0.03, dt);
    } else if (this.mode === 'fall') {
      this.fall(dt);
    } else if (this.mode === 'idle') {
      this.timer -= dt;
      if (this.timer <= 0) {
        var lo = G.minX, hi = maxXFor(this.m.fw);
        var t = Math.round(rand(lo, hi));
        if (Math.abs(t - this.x) < 20) { t = this.x < (lo + hi) / 2 ? hi : lo; }
        this.walkTo(t);
      }
    } else if (this.mode === 'walk') {
      this.x += this.dir * this.walkSpeed * dt;
      if ((this.dir > 0 && this.x >= this.target) || (this.dir < 0 && this.x <= this.target)) {
        this.x = this.target; this.mode = 'idle'; this.timer = rand(1.2, 4.5); this.frame = 0; this.walkSpeed = this.speed;
      } else {
        this.ft += dt * 60 * Math.max(1, this.walkSpeed / this.speed);
        while (this.ft >= this.m.durs[this.frame]) {
          this.ft -= this.m.durs[this.frame];
          this.frame = (this.frame + 1) % this.m.durs.length;
        }
      }
    }
    this.draw();
  };
  Walker.prototype.draw = function () {
    var m = this.m, a = this.anim, s = a ? a.s : m, row, frame, ox = 0, oy = 0;
    if (a) { row = a.row; frame = a.frame; }
    else if (this.mode === 'walk') { row = this.dir > 0 ? ROW_RIGHT : ROW_LEFT; frame = this.frame; }
    else { row = this.face != null ? this.face : ROW_DOWN; frame = 0; }
    if (a && s.fake) {
      var p = Math.min(1, a.t / a.total), toward = row === ROW_LEFT ? -1 : 1;
      if (s.fake === 'Hop') { oy = Math.sin(p * Math.PI) * 7; }
      else if (s.fake === 'Hurt' || s.fake === 'Charge') { ox = frame % 2 ? 1 : -1; }
      else if (s.fake === 'Attack') { ox = Math.sin(p * Math.PI) * 6 * toward; }
      else if (s.fake === 'Rotate') { row = [0, 2, 4, 6][Math.floor(p * 8) % 4]; }
      if (s.fake === 'Idle') { frame = 0; }
    }
    var url = a ? s.url : this.base + 'walk/' + this.dex + '.png';
    var key = url + '|' + s.fw + '|' + s.fh;
    if (this.sheetKey !== key) {
      this.sheetKey = key;
      this.el.style.width = s.fw + 'px';
      this.el.style.height = s.fh + 'px';
      this.el.style.backgroundImage = 'url(' + url + ')';
    }
    // Every sheet shares the walk sheet's anchor (the frame centre), so bigger frames just shift by half the difference.
    var pad = (row === ROW_RIGHT || row === ROW_LEFT ? m.padSide : m.padDown) + (s.fh - m.fh) / 2;
    this.el.style.bottom = Math.round(G.ground - pad + this.y + oy) + 'px';
    this.el.style.backgroundPosition = (-frame * s.fw) + 'px ' + (-row * s.fh) + 'px';
    this.el.style.transform = 'translateX(' + Math.round(this.x - (s.fw - m.fw) / 2 + ox) + 'px)' +
      (Math.abs(this.tilt) > 0.5 ? ' rotate(' + this.tilt.toFixed(1) + 'deg)' : '');
    if (this.tag) { this.placeTag(); }
  };
  Walker.prototype.remove = function () {
    this.breakUp();
    this.gone = true;
    this.hideTag();
    if (press && press.w === this) { endPress(); }
    var el = this.el;
    el.style.opacity = '0';
    setTimeout(function () { el.remove(); }, 750);
  };

  // ---- Little pixel icons that pop up over a Pokémon's head.
  var ICONS = {
    heart: { c: '#FF5C7C', p: ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'] },
    note:  { c: '#8FD3FF', p: ['..###', '..#.#', '..#..', '..#..', '###..', '###..'] },
    anger: { c: '#FF4D3A', p: ['.#.#.', '##.##', '.....', '##.##', '.#.#.'] },
    pow:   { c: '#FFE15A', p: ['...#...', '.#.#.#.', '..###..', '#######', '..###..', '.#.#.#.', '...#...'] },
    bang:  { c: '#FFE15A', p: ['##', '##', '##', '..', '##'] },
    swirl: { c: '#C9B6FF', p: ['.###.', '#...#', '#.#.#', '#..##', '.##..'] },
    star:  { c: '#FFE15A', p: ['..#..', '.###.', '#####', '.###.', '.#.#.'] },
    sweat: { c: '#7FC8FF', p: ['.#.', '##.', '###', '###', '.#.'] }
  };
  var iconSvg = {};
  function icon(kind) {
    if (iconSvg[kind]) { return iconSvg[kind]; }
    var ic = ICONS[kind], w = ic.p[0].length, h = ic.p.length, r = '';
    ic.p.forEach(function (line, y) {
      for (var x = 0; x < w; x++) { if (line[x] === '#') { r += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>'; } }
    });
    // Drawn at 1 px per pixel, like the sprites, with a dark outline so it reads on any ground.
    iconSvg[kind] = '<svg width="' + (w + 2) + '" height="' + (h + 2) + '" viewBox="-1 -1 ' + (w + 2) + ' ' + (h + 2) +
      '" shape-rendering="crispEdges" aria-hidden="true"><g fill="#0B0F14" transform="translate(-1 0)">' + r +
      '</g><g fill="#0B0F14" transform="translate(1 0)">' + r + '</g><g fill="#0B0F14" transform="translate(0 -1)">' + r +
      '</g><g fill="#0B0F14" transform="translate(0 1)">' + r + '</g><g fill="' + ic.c + '">' + r + '</g></svg>';
    return iconSvg[kind];
  }
  function emoteAt(cx, bottom, kind) {
    var ic = ICONS[kind], w = ic.p[0].length + 2, h = ic.p.length + 2;
    var e = document.createElement('span');
    e.className = 'emote';
    e.innerHTML = icon(kind);
    e.style.left = Math.round(clamp(cx - w / 2, 1, G.w - w - 1)) + 'px';
    e.style.bottom = Math.round(clamp(bottom, 0, G.h - h - 1)) + 'px';
    $('route').appendChild(e);
    setTimeout(function () { e.remove(); }, 1500);
  }
  Walker.prototype.headY = function () { return G.ground + this.y + this.m.h + 2; };
  Walker.prototype.emote = function (kind, dx) { emoteAt(this.center() + (dx || 0), this.headY(), kind); };
  function emoteBetween(a, b, kind) { emoteAt((a.center() + b.center()) / 2, Math.max(a.headY(), b.headY()) + 2, kind); }
  Walker.prototype.dust = function () {
    var cx = this.center(), route = $('route');
    for (var i = 0; i < 4; i++) {
      var d = document.createElement('span'), side = i < 2 ? -1 : 1;
      d.className = 'dust';
      d.style.left = Math.round(cx + side * rand(2, 6)) + 'px';
      d.style.bottom = (G.ground + 1) + 'px';
      route.appendChild(d);
      (function (d, dx, dy) {
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          d.style.transform = 'translate(' + dx + 'px,' + (-dy) + 'px)'; d.style.opacity = '0';
        }); });
        setTimeout(function () { d.remove(); }, 500);
      })(d, side * rand(4, 9), rand(1, 4));
    }
  };

  // ---- Hover: stop, look at you, show the name.
  Walker.prototype.showTag = function () {
    if (!this.tag) {
      var t = document.createElement('span');
      t.className = 'nameTag';
      t.textContent = (names[this.dex] || ('#' + this.dex)) + (this.shiny ? ' ★' : '');
      if (this.shiny) { t.style.color = state.accent; }
      $('route').appendChild(t);
      this.tag = t;
    }
    this.placeTag();
  };
  Walker.prototype.placeTag = function () {
    var w = this.tag.offsetWidth, h = this.tag.offsetHeight;
    this.tag.style.left = Math.round(clamp(this.center() - w / 2, 2, G.w - w - 2)) + 'px';
    this.tag.style.bottom = Math.round(clamp(this.headY() + 1, 0, G.h - h - 2)) + 'px';
  };
  Walker.prototype.hideTag = function () { if (this.tag) { this.tag.remove(); this.tag = null; } };
  Walker.prototype.look = function () {
    this.seq++;
    this.mode = 'look'; this.face = ROW_DOWN; this.y = 0;
    this.hold();
  };
  Walker.prototype.hoverIn = function () {
    this.hover = true;
    if (press && press.held) { return; }
    this.showTag();
    if (this.mode === 'idle' || this.mode === 'walk') { this.look(); }
  };
  Walker.prototype.hoverOut = function () {
    this.hover = false;
    this.hideTag();
    var self = this;
    if (this.mode === 'look') { this.later(0.5, function () { if (!self.hover && self.mode === 'look') { self.resume(rand(0.2, 0.8)); } }); }
  };
  // After a scripted moment: keep looking at you if you're still pointing at it, else wander off.
  Walker.prototype.settle = function () { if (this.hover) { this.look(); this.showTag(); } else { this.resume(); } };

  // ---- Click: petting. A few pets make it happy; too many make it cross.
  Walker.prototype.pet = function () {
    if (this.mode === 'held' || this.mode === 'fall') { return; }
    this.breakUp();
    var now = Date.now(), self = this;
    this.pets = this.pets.filter(function (t) { return now - t < 3000; });
    this.pets.push(now);
    var n = this.pets.length;
    this.hideTag();   // the reaction icons go where the name tag sits; settle() brings it back
    this.seq++; this.mode = 'act'; this.face = ROW_DOWN; this.y = 0;
    if (n >= 7) {
      this.pets = [];
      this.emote('anger');
      this.play('Charge', ROW_DOWN, { loops: 3, done: function () { self.emote('anger', 3); self.huff(); } });
      return;
    }
    this.emote('heart');
    if (n >= 4) {
      this.emote('note', 7);
      this.later(0.35, function () { self.emote('heart', -6); });
      this.play('Hop', ROW_DOWN, { loops: 3, done: function () { self.settle(); } });
    } else {
      this.play('Hop', ROW_DOWN, { loops: 2, done: function () { self.settle(); } });
    }
  };
  // Stomp off to the far side of the route, quickly.
  Walker.prototype.huff = function () {
    var far = this.center() < G.w / 2 ? maxXFor(this.m.fw) : G.minX;
    this.resume();
    this.walkTo(far, this.speed * 2.2);
    this.cool = rand(10, 16);
  };
  Walker.prototype.startle = function () {
    if (this.busy()) { return; }
    var self = this;
    this.seq++; this.mode = 'act'; this.face = ROW_DOWN; this.y = 0;
    this.emote('bang');
    this.play('Hop', ROW_DOWN, { done: function () { self.settle(); } });
  };

  // ---- Drag: pick it up, carry it along the route, drop it.
  var press = null;
  function routePoint(e) {
    var r = $('route').getBoundingClientRect();
    return { x: e.clientX - r.left, y: r.bottom - e.clientY };
  }
  function startPress(w, e) {
    press = { w: w, x0: e.clientX, y0: e.clientY, lastX: e.clientX, held: false };
  }
  function endPress() {
    press = null;
    document.body.classList.remove('grabbing');
  }
  Walker.prototype.pickUp = function () {
    this.breakUp();
    this.seq++;
    this.mode = 'held'; this.face = ROW_DOWN; this.tilt = 0;
    this.hideTag();
    this.el.style.zIndex = '6';
    this.play('Hurt', ROW_DOWN, { loops: Infinity });
    this.emote('bang');
    document.body.classList.add('grabbing');
  };
  Walker.prototype.carry = function (e) {
    var p = routePoint(e), m = this.m;
    this.x = clamp(p.x - m.fw / 2, 0, G.w - m.fw);
    // Held by the scruff: the cursor sits near the top of its head.
    this.y = clamp(p.y - G.ground - m.h + 3, 2, Math.max(2, G.h - G.ground - 6));
    this.tilt = clamp(this.tilt + (e.clientX - press.lastX) * 2, -35, 35);
    press.lastX = e.clientX;
  };
  Walker.prototype.drop = function () {
    this.mode = 'fall'; this.vy = 0; this.dropFrom = this.y; this.anim = null;
    this.x = place(this.m, this.x);
  };
  Walker.prototype.fall = function (dt) {
    this.vy -= 900 * dt;
    this.y += this.vy * dt;
    this.tilt *= Math.pow(0.001, dt);
    if (this.y > 0) { return; }
    this.y = 0;
    if (this.vy < -150) { this.vy = -this.vy * 0.3; this.dust(); return; }   // one small bounce
    this.vy = 0; this.tilt = 0;
    this.dust();
    var self = this;
    this.mode = 'act'; this.face = ROW_DOWN;
    this.el.style.zIndex = '';
    if (this.dropFrom > 12) {
      this.emote('swirl');
      this.play('Hurt', ROW_DOWN, { loops: 2, done: function () { self.settle(); } });
    } else {
      this.play('Idle', ROW_DOWN, { done: function () { self.settle(); } });
    }
  };

  // ---- Meetings: when two walkers cross paths they sometimes stop and have a moment.
  var MOODS = ['love', 'friends', 'fun', 'angry', 'fight'];
  var meetCool = rand(4, 8);
  function checkMeetings(dt) {
    meetCool -= dt;
    if (meetCool > 0) { return; }
    for (var i = 0; i < walkers.length; i++) {
      for (var j = i + 1; j < walkers.length; j++) {
        var a = walkers[i], b = walkers[j];
        if (!free(a) || !free(b) || (a.mode !== 'walk' && b.mode !== 'walk')) { continue; }
        if (Math.abs(a.center() - b.center()) > (a.m.fw + b.m.fw) * 0.3 + 6) { continue; }
        if (Math.random() < 0.65) { meet(a, b); meetCool = rand(12, 25); return; }
        a.cool = b.cool = rand(5, 9);   // passed each other by this time
      }
    }
  }
  function free(w) { return (w.mode === 'walk' || w.mode === 'idle') && w.cool <= 0 && !w.hover; }
  function meet(a, b, mood) {
    var L = a.center() <= b.center() ? a : b, R = L === a ? b : a;
    var gap = (L.m.fw + R.m.fw) * 0.3 + 4, mid = (L.center() + R.center()) / 2;
    [L, R].forEach(function (w) { w.seq++; w.mode = 'act'; w.anim = null; w.y = 0; w.cool = rand(20, 40); });
    L.partner = R; R.partner = L;
    L.face = ROW_RIGHT; R.face = ROW_LEFT;
    L.x = place(L.m, mid - gap / 2 - L.m.fw / 2);
    R.x = place(R.m, Math.max(mid + gap / 2, L.center() + gap) - R.m.fw / 2);
    L.hold(); R.hold();
    mood = mood || MOODS[Math.floor(Math.random() * MOODS.length)];
    L.emote('bang');
    L.later(0.6, function () { SCENES[mood](L, R); });
  }
  function part(L, R, how) {
    L.partner = R.partner = null;
    L.resume(); R.resume();
    if (how === 'together') {
      // Walk off side by side at the same pace.
      var gap = R.x - L.x, sp = (L.speed + R.speed) / 2;
      if (Math.random() < 0.5) { L.walkTo(G.minX, sp); R.walkTo(G.minX + gap, sp); }
      else { R.walkTo(maxXFor(R.m.fw), sp); L.walkTo(maxXFor(R.m.fw) - gap, sp); }
    } else {
      var huff = how === 'huff';
      L.walkTo(rand(G.minX, L.x - 10), huff ? L.speed * 2.2 : null);
      R.walkTo(rand(R.x + 10, maxXFor(R.m.fw)), huff ? R.speed * 2.2 : null);
    }
  }
  var SCENES = {
    love: function (L, R) {
      L.emote('heart');
      L.later(0.5, function () { R.emote('heart'); });
      L.later(1.0, function () { emoteBetween(L, R, 'heart'); L.play('Hop', ROW_RIGHT, { done: function () { L.hold(); } }); });
      L.later(1.8, function () { emoteBetween(L, R, 'heart'); R.play('Hop', ROW_LEFT, { done: function () { R.hold(); } }); });
      L.later(3.0, function () { emoteBetween(L, R, 'heart'); part(L, R, 'together'); });
    },
    friends: function (L, R) {
      L.emote('note'); R.emote('note');
      L.play('Hop', ROW_RIGHT, { loops: 2, done: function () { L.hold(); } });
      R.play('Hop', ROW_LEFT, { loops: 2, done: function () { R.hold(); } });
      L.later(0.9, function () { emoteBetween(L, R, 'note'); });
      L.later(2.0, function () { part(L, R, 'together'); });
    },
    fun: function (L, R) {
      L.emote('star'); R.emote('star');
      L.play('Rotate', ROW_RIGHT, { loops: 2, done: function () {
        emoteBetween(L, R, 'note');
        L.play('Hop', ROW_RIGHT, { done: function () { L.hold(); } });
        R.play('Hop', ROW_LEFT, { done: function () { R.hold(); } });
        L.later(1.2, function () { part(L, R, 'apart'); });
      } });
      R.play('Rotate', ROW_LEFT, { loops: 2, done: function () { R.hold(); } });
    },
    angry: function (L, R) {
      L.emote('anger');
      L.play('Charge', ROW_RIGHT, { loops: 3, done: function () { L.hold(); } });
      L.later(0.5, function () { R.emote('anger'); R.play('Charge', ROW_LEFT, { loops: 3, done: function () { R.hold(); } }); });
      L.later(1.9, function () { L.emote('anger', -4); R.emote('anger', 4); });
      L.later(2.6, function () { part(L, R, 'huff'); });
    },
    fight: function (L, R) {
      var rounds = 2 + Math.floor(Math.random() * 2), atk = Math.random() < 0.5 ? L : R;
      function swing() {
        var a = atk, d = a === L ? R : L;
        a.el.style.zIndex = '3'; d.el.style.zIndex = '2';
        a.play('Attack', a.face, {
          hit: function () {
            d.emote('pow');
            d.play('Hurt', d.face, { loops: 2, done: function () { d.hold(); } });
            d.x = place(d.m, d.x + (d === R ? 3 : -3));
          },
          done: function () {
            a.hold();
            if (--rounds > 0) { atk = d; L.later(0.3, swing); } else { L.later(0.5, finish); }
          }
        });
      }
      function finish() {
        var loser = Math.random() < 0.5 ? L : R, winner = loser === L ? R : L;
        loser.emote('swirl');
        loser.play('Hurt', loser.face, { loops: 2, done: function () { loser.hold(); } });
        winner.emote('star');
        winner.play('Hop', winner.face, { loops: 2, done: function () { winner.hold(); } });
        L.later(1.6, function () { part(L, R, 'apart'); });
      }
      L.emote('anger', -3); R.emote('anger', 3);
      L.later(0.5, swing);
    }
  };

  function fits(map, d) { return map[d] && map[d].h <= G.maxH && map[d].fw <= G.w - G.minX - G.right; }

  function rollShiny(dex, force) {
    if (!fits(walkShiny, dex)) { return false; }
    return force || Math.random() < 1 / shinyOdds;
  }

  function place(m, x) { return Math.max(G.minX, Math.min(x, maxXFor(m.fw))); }

  function spawn(dex, x, forceShiny) {
    var shiny = rollShiny(dex, forceShiny);
    var m = shiny ? walkShiny[dex] : walk[dex];
    return new Walker(dex, place(m, x), shiny);
  }

  function slotX(i, n) { return G.minX + ((G.w - G.right - G.minX) / n) * (i + 0.3); }

  function setRoster(dexes) {
    walkers.forEach(function (w) { w.remove(); });
    walkers = [];
    var usable = dexes.filter(function (d) { return fits(walk, d); }).slice(0, G.count);
    while (usable.length < G.count) {
      var extra = randomDex(usable, false);
      if (extra == null) { break; }
      usable.push(extra);
    }
    usable.forEach(function (dex, i) { walkers.push(spawn(dex, slotX(i, usable.length))); });
  }

  function randomDex(exclude, needShiny) {
    var pool = Object.keys(walk).map(Number).filter(function (d) {
      return d !== 143 && fits(walk, d) && exclude.indexOf(d) < 0 && (!needShiny || fits(walkShiny, d));
    });
    return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  }

  function shuffle() {
    var pick = [];
    while (pick.length < G.count) {
      var d = randomDex(pick, false);
      if (d == null) { break; }
      pick.push(d);
    }
    setRoster(pick);
  }
  $('ball').addEventListener('click', shuffle);

  // Poke the sleeping Snorlax: it stirs; poke it a lot and it grumbles loud enough to startle everyone.
  var snorPokes = [], zzzTimer = 0;
  $('snorlax').addEventListener('click', function () {
    var now = Date.now(), s = $('snorlax');
    snorPokes = snorPokes.filter(function (t) { return now - t < 4000; });
    snorPokes.push(now);
    s.classList.remove('stir'); void s.offsetWidth; s.classList.add('stir');
    $('zzz').style.visibility = 'hidden';
    clearTimeout(zzzTimer);
    zzzTimer = setTimeout(function () { $('zzz').style.visibility = ''; }, 4000);
    var r = $('route').getBoundingClientRect(), sr = s.getBoundingClientRect();
    var cx = sr.left - r.left + sr.width / 2, top = r.bottom - sr.top - 6;
    if (snorPokes.length >= 4) {
      snorPokes = [];
      emoteAt(cx, top, 'anger');
      walkers.forEach(function (w, i) { setTimeout(function () { if (!w.gone) { w.startle(); } }, i * 120); });
    } else {
      emoteAt(cx, top, snorPokes.length === 1 ? 'sweat' : 'bang');
    }
  });
  $('snorlax').addEventListener('animationend', function (e) { if (e.animationName === 'stir') { this.classList.remove('stir'); } });

  // Swap one visitor for a new one (a fresh chance at a shiny).
  function rotate(forceShiny) {
    if (!walkers.length) { return; }
    var i = Math.floor(Math.random() * walkers.length);
    if (forceShiny) {
      var plain = walkers.map(function (w, k) { return w.shiny ? -1 : k; }).filter(function (k) { return k >= 0; });
      if (plain.length) { i = plain[Math.floor(Math.random() * plain.length)]; }
    }
    var old = walkers[i];
    if (old.busy() || old.hover) { return; }
    var dex = randomDex(walkers.map(function (w) { return w.dex; }), forceShiny);
    if (dex == null) { return; }
    old.remove();
    walkers[i] = spawn(dex, old.x, forceShiny);
  }
  (function schedule() {
    setTimeout(function () { rotate(false); schedule(); }, rand(240, 480) * 1000);
  })();

  // Re-fit the route and its visitors to the current size, keeping who's there (and their shininess).
  function layoutRoute() {
    var r = $('route');
    var slot = document.querySelector('#' + { large: 'lg', medium: 'md', small: 'sm', mini: 'mi' }[size] + ' .routeSlot');
    slot.appendChild(r);
    r.style.width = G.w + 'px';
    r.style.height = G.h + 'px';
    r.style.padding = G.pad + 'px';
    r.style.borderRadius = G.radius + 'px';
    r.style.background = G.open ? 'transparent' : '';
    r.style.boxShadow = G.open ? 'none' : '';
    $('groundLine').style.bottom = (G.ground + 1) + 'px';
    $('groundLine').style.background = G.open ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.07)';
    var defaultGrass = [150, 318, 424, 96];
    document.querySelectorAll('#route .grass').forEach(function (g, i) {
      var left = G.grass ? G.grass[i] : defaultGrass[i];
      g.style.display = left == null ? 'none' : 'block';
      if (left != null) { g.style.left = left + 'px'; }
      g.style.bottom = (G.ground - 1) + 'px';
    });
    var bs = G.ballSize || 44;
    $('ball').style.display = G.ball ? 'flex' : 'none';
    $('ball').style.width = bs + 'px';
    $('ball').style.height = bs + 'px';
    $('ball').style.marginTop = (-bs / 2) + 'px';
    var ss = G.snorlaxSize || 46;
    $('snorlax').style.display = G.snorlax ? 'block' : 'none';
    $('snorlax').style.width = ss + 'px';
    $('snorlax').style.height = ss + 'px';
    $('snorlax').style.right = (G.open ? 0 : 8) + 'px';
    $('zzz').style.display = G.snorlax ? 'block' : 'none';
    $('snorlax').style.bottom = (G.ground - 2) + 'px';
    $('zzz').style.top = Math.max(4, G.h - ss - 1) + 'px';
    $('zzz').style.right = (ss + (G.open ? 2 : 10)) + 'px';

    if (!Object.keys(walk).length) { return; }
    var keep = walkers.filter(function (w) { return fits(w.shiny ? walkShiny : walk, w.dex); }).slice(0, G.count);
    walkers.forEach(function (w) { if (keep.indexOf(w) < 0) { w.el.remove(); } });
    walkers = keep;
    if (press) { endPress(); }
    walkers.forEach(function (w, i) { w.x = place(w.m, Math.min(w.x, slotX(i, G.count))); w.resume(rand(0.3, 1.5)); w.hideTag(); w.draw(); });
    while (walkers.length < G.count) {
      var d = randomDex(walkers.map(function (w) { return w.dex; }), false);
      if (d == null) { break; }
      walkers.push(new Walker(d, place(walk[d], slotX(walkers.length, G.count)), false, true));
    }
  }

  function setSize(s) {
    if (!ROUTES[s]) { s = 'large'; }
    size = s;
    G = ROUTES[s];
    document.body.setAttribute('data-size', s);
    layoutRoute();
  }

  var last = 0;
  function tick(t) {
    var dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    for (var i = 0; i < walkers.length; i++) { walkers[i].step(dt); }
    if (walkers.length > 1) { checkMeetings(dt); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  $('snorlax').src = gif(143);
  applyAccent();
  setSize('large');

  window.pw = {
    setWalk: function (w) {
      walk = w.normal || {};
      walkShiny = w.shiny || {};
      names = w.names || {};
      setRoster([133, 54, 1]);   // the design's opening roster: Eevee, Psyduck, Bulbasaur
    },
    setSize: setSize,
    summonShiny: function () { rotate(true); },
    update: function (d) {
      state.data = d;
      if (d.shinyOdds) { shinyOdds = Math.max(1, d.shinyOdds); }
      if (d.accent) { state.accent = d.accent; applyAccent(); }
      if (d.size && d.size !== size) { setSize(d.size); }
      if (state.picked > d.month.days) { state.picked = 0; }
      $('monthLabel').textContent = d.month.label;
      renderHeader();
      renderCalendar();
      renderDetail();
      renderStreak();
      renderSystem();
    },
    system: function (s) {
      if (!state.data) { return; }
      state.data.system = s;
      renderSystem();
    },
    shuffle: shuffle
  };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
